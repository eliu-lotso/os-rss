name: Update Apple OS Feed

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Force a test notification'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apple-os-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed and send notifications
        id: generate
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          TEST_MODE: ${{ inputs.test }}
        run: |
          if [ "$TEST_MODE" = "true" ]; then
            python rss_filter.py --test
          else
            python rss_filter.py
          fi

      - name: Save notification state
        if: ${{ always() && steps.generate.outcome != 'skipped' }}
        run: |
          if [ -f .last_guids ]; then
            git add .last_guids
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'chore: save Apple OS notification state'
              git push origin HEAD:main
            fi
          fi

      - name: Upload RSS feed
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Publish RSS feed
        id: deployment
        uses: actions/deploy-pages@v5
