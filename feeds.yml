feeds:
  - name: "Apple Developer Releases"
    url: "https://developer.apple.com/news/releases/rss/releases.rss"
    filters:
      keywords:
        - "iOS"
        - "macOS"
        - "iPadOS"
        - "watchOS"
      min_version: 26
      max_age_days: 5
  - name: "Apple Security Releases"
    type: apple_security
    url: "https://support.apple.com/en-us/100100"
    filters:
      keywords:
        - "iOS"
        - "macOS"
        - "iPadOS"
        - "watchOS"
      min_version: 26
      max_age_days: 30
